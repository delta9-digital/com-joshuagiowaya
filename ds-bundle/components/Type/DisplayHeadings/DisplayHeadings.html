<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../styles.css">
<style>
  body { padding: 2.5rem; display: grid; gap: 1.75rem; }
  .label { font-family: var(--jg-font-body); font-size: var(--jg-text-xs); color: var(--jg-text-muted); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 0.25rem; }
  .dark { background: var(--jg-ink); color: var(--jg-text-on-dark); padding: 1.5rem 2rem; margin: 0 -1rem; }
  .dark .label { color: var(--jg-gray-300); }
</style>
</head>
<body>
  <div class="dark">
    <div class="label">Hero — Blackout Sunrise</div>
    <div class="jg-display" style="font-size: 3.5rem;">Developer &amp; Designer</div>
  </div>
  <div>
    <div class="label">Display alt — Blackout Midnight</div>
    <div class="jg-display jg-display--midnight" style="font-size: 2.5rem;">JGDzine.com</div>
  </div>
  <div>
    <div class="label">Display open — Blackout 2AM</div>
    <div class="jg-display jg-display--2am" style="font-size: 2.5rem;">Work Experience</div>
  </div>
  <div>
    <div class="label">Section heading — Norwester</div>
    <div class="jg-heading" style="font-size: 1.75rem;">Recent Projects</div>
    <div class="jg-heading" style="font-size: 1.1rem; color: var(--jg-cyan); margin-top: 0.5rem;">What excites you about coding?</div>
  </div>
</body>
</html>
