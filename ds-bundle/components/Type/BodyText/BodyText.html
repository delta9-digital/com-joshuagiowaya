<!-- @dsCard group="Type" name="Body text" subtitle="Open Sans variable, 300–800 + italic" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../styles.css">
<style>
  body { padding: 2.5rem; max-width: 620px; display: grid; gap: 1rem; }
  .row { display: flex; gap: 1rem; align-items: baseline; }
  .w { font-size: var(--jg-text-xs); color: var(--jg-text-muted); width: 3.5rem; flex: none; }
</style>
</head>
<body>
  <p style="font-size: var(--jg-text-lg); font-weight: 300;">Open Sans carries all body copy and UI text — friendly, neutral, and legible against the loud display faces.</p>
  <div class="row"><span class="w">300</span><span style="font-weight:300">Light — large intro paragraphs</span></div>
  <div class="row"><span class="w">400</span><span style="font-weight:400">Regular — default body copy</span></div>
  <div class="row"><span class="w">600</span><span style="font-weight:600">Semibold — emphasis, labels, links</span></div>
  <div class="row"><span class="w">800</span><span style="font-weight:800">Extrabold — small loud UI moments</span></div>
  <div class="row"><span class="w">Italic</span><span style="font-style:italic">Italic — quotes and asides</span></div>
</body>
</html>
